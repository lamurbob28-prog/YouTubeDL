name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Reuse development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: youtubedl-debug-signing-v1

      - name: Install yt-dlp for offline format integration tests
        run: |
          python -m pip install yt-dlp==2026.8.19
          echo "YTDLP_TEST_BIN=$(command -v yt-dlp)" >> "$GITHUB_ENV"

      - name: Test, lint, and build debug APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify native engine, MP4 merge, storage, and screen recreation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon
            adb shell am start -W -n dev.lamurbob.youtubedl/.MainActivity
            sleep 2
            adb exec-out screencap -p > app/build/reports/ui.png

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDL-verification
          path: app/build/reports/
